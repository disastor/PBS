# register-vendor-artifact.yml — PBS component (third-party, no build step).
# workflow_call trigger removed - see ngsm-base/build.yml for why.
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: register-vendor-artifact

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        default: 2024.1.3
        description: Vendor-supplied PBS Professional version to register

jobs:
  register:
    outputs:
      artifact-id: pbs-artifact-${{ cloudbees.version }}
      version: ${{ inputs.version }}
    steps:
      - name: Register vendor-supplied PBS artifact
        uses: cloudbees-io/register-build-artifacts@main
        with:
          artifact-metadata: |
            [
              {
                "name": "pbs",
                "version": "${{ inputs.version }}",
                "url": "https://artifactory.example.internal/hpe-releases/pbs/${{ inputs.version }}/pbs-professional.tar.gz",
                "type": "generic"
              }
            ]
